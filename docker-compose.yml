services:
  work-report:
    build:
      context: .
      args:
        # 国内默认 DaoCloud；可在 .env 里改 NODE_IMAGE / PYTHON_IMAGE
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
    image: work-report:latest
    container_name: work-report
    ports:
      - "6790:6790"
    environment:
      DATA_DIR: /data
    # 空库首次启动会 seed 进 SQLite；之后以库内配置为准
    env_file:
      - .env
    volumes:
      # SQLite 与运行数据持久化
      - ./data:/data
    restart: unless-stopped
